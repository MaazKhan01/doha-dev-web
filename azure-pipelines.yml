trigger:
  branches:
    include:
      - doha-2036-dev

variables:
  dockerfilePath: Dockerfile
  imageName: doha2036-fe-dev
  nonProdhubServiceConnection: spn-ucms-dev-secret
  nonProdHubContainerRepository: crqochubqac001.azurecr.io

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
    # ==================== Doha 2036 DEV JOB ====================
    - job: BuildDohaDev
      displayName: Build job for Doha 2036 (${{ replace(variables['Build.SourceBranch'], 'refs/heads/', '') }})
      condition: eq(variables['Build.SourceBranch'], 'refs/heads/doha-2036-dev')
      pool:
        name: AgentPool-QOC-Hub
      steps:
        # doha-2036-dev branch -> DEV_DOHA2036_NEXT_PUBLIC_* variables
        - script: |
            echo "Branch is doha-2036-dev: using DEV_DOHA2036_ variables"
            echo "NEXT_PUBLIC_API_URL=$(DEV_DOHA2036_NEXT_PUBLIC_API_URL)" > .env
            echo "NEXT_PUBLIC_WP_URL=$(DEV_DOHA2036_NEXT_PUBLIC_API_URL)" >> .env
            cat .env
          displayName: 'Write .env for $(Build.SourceBranchName)'
        - task: Docker@1
          displayName: 'Build Image $(imageName):$(Build.BuildId)'
          inputs:
            containerregistrytype: 'Azure Container Registry'
            azureSubscriptionEndpoint: $(nonProdhubServiceConnection)
            azureContainerRegistry: $(nonProdHubContainerRepository)
            command: 'Build an image'
            dockerFile: '$(dockerfilePath)'
            imageName: '$(imageName):$(Build.BuildId)'
        - task: Docker@1
          displayName: 'Push Image $(imageName):$(Build.BuildId)'
          inputs:
            command: 'Push an image'
            containerregistrytype: 'Azure Container Registry'
            azureSubscriptionEndpoint: $(nonProdhubServiceConnection)
            azureContainerRegistry: $(nonProdHubContainerRepository)
            dockerFile: $(dockerfilePath)
            imageName: '$(imageName):$(Build.BuildId)'
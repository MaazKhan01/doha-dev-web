trigger:
  branches:
    include:
      - doha-2036-dev

variables:
  dockerfilePath: Dockerfile
  imageName: doha2036-fe
  nonProdhubServiceConnection: spn-ucms-dev-secret
  nonProdHubContainerRepository: crqochubqac001.azurecr.io

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
    - job: BuildDev
      displayName: Build job (doha-2036-dev)
      condition: eq(variables['Build.SourceBranch'], 'refs/heads/doha-2036-dev')
      pool:
        name: AgentPool-QOC-Hub
      steps:
        - script: |
            echo "NEXT_PUBLIC_WP_URL=$(STG_NEXT_PUBLIC_WP_URL)" > .env
            echo "CMS_GRAPHQL_TOKEN=$CMS_GRAPHQL_TOKEN" >> .env
          displayName: 'Write .env (STG CMS)'
          env:
            CMS_GRAPHQL_TOKEN: $(CMS_GRAPHQL_TOKEN)


        - task: Docker@1
          displayName: 'Build Image $(imageName):$(Build.BuildId)'
          inputs:
            containerregistrytype: 'Azure Container Registry'
            azureSubscriptionEndpoint: $(nonProdhubServiceConnection)
            azureContainerRegistry: $(nonProdHubContainerRepository)
            command: 'Build an image'
            dockerFile: '$(dockerfilePath)'
            imageName: '$(imageName):$(Build.BuildId)'

        - task: Docker@1
          displayName: 'Push Image $(imageName):$(Build.BuildId)'
          inputs:
            command: 'Push an image'
            containerregistrytype: 'Azure Container Registry'
            azureSubscriptionEndpoint: $(nonProdhubServiceConnection)
            azureContainerRegistry: $(nonProdHubContainerRepository)
            dockerFile: $(dockerfilePath)
            imageName: '$(imageName):$(Build.BuildId)'